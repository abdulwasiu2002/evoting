    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }

      /* --- BACKGROUNDS --- */
      .bg-tech-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }

      /* --- ANIMATIONS --- */
      @keyframes float-y {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      
      @keyframes float-y-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(15px); }
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      .animate-float-slow { animation: float-y 6s ease-in-out infinite; }
      .animate-float-medium { animation: float-y 5s ease-in-out infinite; }
      .animate-float-fast { animation: float-y 4s ease-in-out infinite; }
      .animate-float-reverse { animation: float-y-reverse 5.5s ease-in-out infinite; }
      
      .animate-pulse-ring { animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .animate-fade-in { animation: fade-in-up 0.8s ease-out forwards; }
      .animate-blob { animation: blob 7s infinite; }
      
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }

      /* UTILITIES */
      .glass-card-sm {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      }
    </style>
